name: CI / Deploy to Azure VM
name: CI / Build Docker & Deploy to Azure VM

on:
  push:
    branches: [ main, dev ]

env:
  IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-jenkins:${{ github.sha }}

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ env.IMAGE }}
          ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-jenkins:latest

  deploy:
    name: Deploy image to Azure VM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
    - name: Wait a few seconds for registry
      run: sleep 3

    - name: SSH to Azure VM and deploy container
      uses: appleboy/ssh-action@v0.1.8
      with:
        host: ${{ secrets.AZURE_VM_IP }}
        username: ${{ secrets.AZURE_VM_USER }}
        key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
        port: 22
        script: |
          set -e
          # install docker if missing (best-effort)
          if ! command -v docker >/dev/null 2>&1; then
            echo 'Docker not found; installing...'
            curl -fsSL https://get.docker.com | sh
            sudo usermod -aG docker $USER || true
          fi
          IMAGE=${{ env.IMAGE }}
          echo "Pulling $IMAGE"
          docker pull "$IMAGE"
          # stop existing container if running
          docker rm -f nodejs-jenkins || true
          # run new container
          docker run -d --name nodejs-jenkins -p 3000:3000 --restart unless-stopped "$IMAGE"
          sleep 2
          echo 'Container started on Azure VM'

    - name: Remote health check
      run: |
        ip=${{ secrets.AZURE_VM_IP }}
        for i in $(seq 1 10); do
          if curl -sS http://${ip}:3000/health | grep -q 'healthy'; then
            echo 'Remote app is healthy'
            exit 0
          fi
          echo 'Waiting for remote app...'
          sleep 2
        done
        echo 'Remote app did not become healthy' >&2
        exit 1
      shell: bash