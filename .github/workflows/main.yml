name: CI / Build & Deploy to Local VM

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

env:
  IMAGE_NAME: nodejs-jenkins
  IMAGE_TAG: latest
  IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-jenkins:latest

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ env.IMAGE_REPO }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy to Local VM (VirtualBox)
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Deploy via SSH to Local VM
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.LOCAL_VM_IP }}         # e.g. 192.168.0.146
          username: ${{ secrets.LOCAL_VM_USER }}    # e.g. walexicant1
          key: ${{ secrets.LOCAL_VM_SSH_KEY }}      # private key for your VM
          port: 22
          script: |
            docker pull ${{ env.IMAGE }}
            docker stop nodejs-jenkins || true
            docker rm nodejs-jenkins || true
            docker run -d --name nodejs-jenkins -p 80:3000 ${{ env.IMAGE }} 